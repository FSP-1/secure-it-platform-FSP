services:
  mysql:
    image: mysql:8.0
    container_name: secureit-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: secureit
      MYSQL_USER: secureit
      MYSQL_PASSWORD: root_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      -  mysql_secureit:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
    


  backend:
    build:
      context: ./backend
    container_name: secureit-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/secureit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: secureit
      SPRING_DATASOURCE_PASSWORD: root_dev_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
          condition: service_healthy


volumes:
  mysql_secureit:
    name: mysql_secureit
  