services:
  mysql:
    image: mysql:8.0
    container_name: secureit-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      -  mysql_secureit:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
    


  backend:
    build:
      context: ./backend
    container_name: secureit-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/secureit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SECUREIT_ADMIN_USERNAME: ${SECUREIT_ADMIN_USERNAME}
      SECUREIT_ADMIN_EMAIL: ${SECUREIT_ADMIN_EMAIL}
      SECUREIT_ADMIN_PASSWORD: ${SECUREIT_ADMIN_PASSWORD}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
          condition: service_healthy


volumes:
  mysql_secureit:
    name: mysql_secureit
  